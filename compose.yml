# One service: the dashboard. Runs are started from its New run button, never by the container.
#
# `conveyor serve` listens on 0.0.0.0 behind Traefik, so starting a run asks for CONVEYOR_LAUNCH_TOKEN. The
# runs are child processes of this one and write to the database on the volume. Stopping the container stops
# them, so a run in flight gets stop_grace_period to finish its sessions.
#
# The API key and the token come from .env, which the ansible playbook templates.

services:
  conveyor:
    build: .
    image: conveyor:local
    restart: unless-stopped
    command: ["conveyor", "serve", "--db", "/data/${DB_NAME:-conveyor.db}", "--host", "0.0.0.0", "--port", "8765"]
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?put it in .env}
      CONVEYOR_LAUNCH_TOKEN: ${CONVEYOR_LAUNCH_TOKEN:?put it in .env}
    volumes:
      - conveyor-runs:/data
    ports:
      - "8765:8765"
    stop_grace_period: 60s

volumes:
  conveyor-runs:
