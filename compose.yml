# One service that does the run and then keeps serving its own dashboard.
#
# `demo` evolves the graph and serves the dashboard live while it works. When it finishes it exits, so the
# container hands over to `serve` against the same database. That way the champions, transcripts and
# comparison views stay browsable after the run ends instead of disappearing with the process.
#
# Run parameters come from .env, which the ansible playbook templates from group_vars/all.yml.

services:
  conveyor:
    build: .
    image: conveyor:local
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        conveyor demo
        --painter llm
        --harness pi
        --provider ${PROVIDER:-opencode-go}
        --paint-model ${PAINT_MODEL:-muse-spark-1.3-contributor}
        --cycles ${CYCLES:-20}
        --width ${WIDTH:-128}
        --strokes ${STROKES:-500}
        --concurrency ${CONCURRENCY:-8}
        --budget ${BUDGET:-5.0}
        --db /data/${DB_NAME:-muse.db}
        --host 0.0.0.0
        --port 8765;
        status=$$?;
        echo "run exited with status $$status; serving the dashboard for review";
        exec conveyor serve --db /data/${DB_NAME:-muse.db} --host 0.0.0.0 --port 8765
    environment:
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:?put it in .env}
    volumes:
      - conveyor-runs:/data
    ports:
      - "8765:8765"
    # A painting in flight should get the chance to finish its turn before the process dies.
    stop_grace_period: 60s

volumes:
  conveyor-runs:
