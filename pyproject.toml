[project]
name = "conveyor"
version = "0.1.0"
description = "Run graphs of darwinian_evolver nodes and watch what each node is doing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "darwinian-evolver @ git+https://github.com/imbue-ai/darwinian_evolver",
    "httpx>=0.27",
    "numpy>=2.0",
    "pillow>=10",
    "pydantic>=2.7",
]

[project.scripts]
conveyor = "conveyor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/conveyor"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
