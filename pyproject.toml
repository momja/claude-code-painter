[project]
name = "conveyor"
version = "0.2.0"
description = "Co-evolve a painter's prompt and the instrument it paints with, using Claude Code, and watch every step"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pillow>=10",
]

[project.scripts]
conveyor = "conveyor.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conveyor"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
