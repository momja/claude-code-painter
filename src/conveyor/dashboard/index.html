<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conveyor</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='6' height='14' rx='1.5' fill='%23264B7A'/%3E%3Crect x='9' y='1' width='6' height='9' rx='1.5' fill='%232E7A6B'/%3E%3Crect x='9' y='11' width='6' height='4' rx='1.5' fill='%23A87818'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ground: #E4E8EC;
  --surface: #F6F8FA;
  --surface-2: #E9EDF1;
  --ink: #18202C;
  --muted: #586373;
  --rule: #C9D0D8;
  --mat: #EFE7D5;
  --pig-0: #264B7A;   /* Prussian blue */
  --pig-1: #2E7A6B;   /* verdigris */
  --pig-2: #A87818;   /* yellow ochre */
  --pig-3: #6A4C86;
  --pig-4: #7A5A3C;
  --alarm: #BC3A22;   /* vermilion, alarms only */
  --warn: #9A6A0E;
  --add-bg: #DCEBE3;
  --del-bg: #F3DCD6;
  --focus: #264B7A;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #11151B;
    --surface: #181E26;
    --surface-2: #202833;
    --ink: #E3E8EE;
    --muted: #97A2B1;
    --rule: #2D3643;
    --mat: #D8CFBD;
    --pig-0: #7EA2D6;
    --pig-1: #5DB7A3;
    --pig-2: #D5A74A;
    --pig-3: #AE8FD0;
    --pig-4: #C39A72;
    --alarm: #EE6A4D;
    --warn: #D9A441;
    --add-bg: #1F3A30;
    --del-bg: #472620;
    --focus: #7EA2D6;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--ground);
  color: var(--ink);
  font: 14px/1.5 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
button { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }

/* ---- top bar ---- */
.bar {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--rule);
}
.wordmark { font-weight: 700; font-size: 19px; letter-spacing: -0.015em; }
.bar select {
  font: inherit; padding: 5px 8px; border: 1px solid var(--rule); border-radius: 6px;
  background: var(--surface); color: var(--ink); max-width: 320px;
}
.runstate { color: var(--muted); display: flex; align-items: center; gap: 8px; }
.runstate .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.runstate.live .dot { background: var(--pig-1); animation: pulse 1.4s ease-in-out infinite; }
.bar .spacer { flex: 1; }
.bar .updated { color: var(--muted); font-size: 12.5px; }
@keyframes pulse { 50% { opacity: .25; } }

main { max-width: 1500px; margin: 0 auto; padding: 20px 24px 64px; display: grid; gap: 20px; }

.panel { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; min-width: 0; }
.panel > header { padding: 12px 16px 4px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.panel h2 { font-size: 15px; font-weight: 600; margin: 0; }
.panel .sub { color: var(--muted); font-size: 12.5px; }
.panel .body { padding: 8px 16px 16px; }

/* ---- graph ---- */
.graph-wrap { overflow-x: auto; }
#graph { position: relative; margin: 8px 16px 16px; }
#graph svg.edges { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.edge { fill: none; stroke: var(--muted); stroke-width: 1.5; }
.edge.feedback { stroke-dasharray: 5 5; }
.edge-label {
  font-size: 12px; fill: var(--muted);
  paint-order: stroke; stroke: var(--surface); stroke-width: 5px; stroke-linejoin: round;
}
.node-card {
  position: absolute; width: 240px; padding: 0; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; overflow: hidden;
  display: flex; flex-direction: column;
}
.node-card:hover { border-color: var(--pig); }
.node-card[aria-pressed="true"] { border-color: var(--pig); box-shadow: 0 0 0 2px var(--pig); }
.node-card .band { height: 6px; background: var(--pig); }
.node-card .head { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 14px 8px; gap: 8px; }
.node-card .name { font-weight: 700; font-size: 17px; letter-spacing: -0.01em; }
.node-card .role { color: var(--muted); font-size: 12px; }
.node-card .mat {
  margin: 0 14px; height: 168px; border-radius: 6px; background: var(--mat);
  display: grid; place-items: center; overflow: hidden;
}
.node-card .mat img { image-rendering: pixelated; width: 100%; height: 100%; object-fit: contain; display: block; }
.node-card .mat .empty { color: #6d6452; font-size: 12.5px; padding: 12px; text-align: center; }
.node-card .facts { padding: 10px 14px 12px; display: grid; gap: 2px; }
.node-card .score-row { display: flex; align-items: baseline; gap: 8px; }
.node-card .score { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.node-card .score-label { color: var(--muted); font-size: 12.5px; }
.node-card .counts { color: var(--muted); font-size: 12.5px; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.status .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); }
.status.live { color: var(--ink); }
.status.live .dot { background: var(--pig); animation: pulse 1.2s ease-in-out infinite; }

/* ---- alarms + blame ---- */
.row-2 { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 20px; }
.alarms { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.alarm { border-left: 3px solid var(--warn); padding: 6px 12px; background: var(--surface-2); border-radius: 0 6px 6px 0; }
.alarm.level-alarm { border-left-color: var(--alarm); }
.alarm.level-info { border-left-color: var(--muted); }
.alarm .t { font-weight: 600; }
.alarm .d { color: var(--muted); font-size: 13px; }
.alarm .chip { font-size: 12px; color: var(--muted); margin-right: 6px; }
.quiet { color: var(--muted); font-size: 13px; }

/* ---- node detail ---- */
.detail-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.detail-head h1 { margin: 0; font-size: 22px; letter-spacing: -0.015em; }
.detail-head .desc { color: var(--muted); }
.swatch { width: 14px; height: 14px; border-radius: 3px; background: var(--pig); flex: none; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; margin-left: auto; }
.seg button { border: 0; background: var(--surface); padding: 6px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--rule); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.stack { display: grid; gap: 20px; min-width: 0; }

.chart { width: 100%; display: block; overflow: visible; }
.chart .grid line { stroke: var(--rule); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 11.5px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: 12.5px; padding-top: 6px; }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 6px; background: var(--c); border-radius: 2px; }
.legend span.area::before { height: 10px; opacity: .8; }

table.yield { width: 100%; border-collapse: collapse; font-size: 13px; }
table.yield th { text-align: right; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--rule); }
table.yield th:first-child, table.yield td:first-child { text-align: left; }
table.yield td { text-align: right; padding: 7px 6px; border-bottom: 1px solid var(--surface-2); }
table.yield td.bad { color: var(--alarm); font-weight: 600; }
table.yield td.good { color: var(--pig); font-weight: 600; }
.bar-cell { display: inline-block; width: 44px; height: 6px; background: var(--surface-2); border-radius: 3px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
.bar-cell i { display: block; height: 100%; background: var(--pig); }

.feed { list-style: none; margin: 0; padding: 0; max-height: 520px; overflow-y: auto; }
.feed li { padding: 9px 0; border-bottom: 1px solid var(--surface-2); display: grid; gap: 2px; }
.feed .summary { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
.feed .summary:hover { text-decoration: underline; }
.feed .meta { color: var(--muted); font-size: 12.5px; }
.up { color: var(--pig); font-weight: 600; }
.down { color: var(--alarm); font-weight: 600; }

.lineage-wrap { overflow: auto; max-height: 520px; border-top: 1px solid var(--surface-2); }
.lineage circle { cursor: pointer; }
.lineage line, .lineage path { stroke: var(--rule); fill: none; }
.lineage path.cross { stroke-dasharray: 3 3; stroke: var(--pig); opacity: .6; }
.lineage text { fill: var(--muted); font-size: 11px; }

.rescores { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13px; max-height: 260px; overflow-y: auto; }
.rescores li { display: flex; justify-content: space-between; gap: 8px; }
.linkish { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.linkish:hover { text-decoration-color: currentColor; }

/* ---- drawer ---- */
.scrim { position: fixed; inset: 0; background: rgba(12, 16, 22, .35); }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(680px, 100vw); overflow-y: auto;
  background: var(--surface); border-left: 1px solid var(--rule); padding: 20px 24px 48px;
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start;
}
.drawer > * { min-width: 0; }
.drawer .top { display: flex; align-items: center; gap: 12px; }
.drawer h1 { margin: 0; font-size: 20px; letter-spacing: -0.01em; }
.drawer .close { margin-left: auto; border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
.drawer h3 { margin: 0 0 8px; font-size: 14px; font-weight: 600; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; }
.kv div { background: var(--surface-2); border-radius: 6px; padding: 8px 10px; }
.kv b { display: block; font-size: 18px; font-weight: 600; }
.kv span { color: var(--muted); font-size: 12px; }
.change { background: var(--surface-2); padding: 10px 12px; border-radius: 6px; }
.diff { margin: 0; border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; background: var(--surface); }
.diff div { padding: 0 10px; white-space: pre; }
.diff .add { background: var(--add-bg); }
.diff .del { background: var(--del-bg); }
.diff .same { color: var(--muted); }
.trips { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.trips figure { margin: 0; }
.trips img { width: 100%; image-rendering: pixelated; border-radius: 4px; background: var(--mat); display: block; }
.trips figcaption { font-size: 12px; color: var(--muted); padding-top: 4px; }
.canvases { display: flex; gap: 12px; flex-wrap: wrap; }
.canvases figure { margin: 0; }
.canvases img { width: 150px; image-rendering: pixelated; border-radius: 4px; display: block; background: var(--mat); }
.canvases figcaption { font-size: 12px; color: var(--muted); }
table.evals { width: 100%; border-collapse: collapse; font-size: 13px; }
table.evals th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--rule); }
table.evals td { padding: 6px; border-bottom: 1px solid var(--surface-2); vertical-align: top; }
.btn { border: 1px solid var(--rule); background: var(--surface); border-radius: 6px; padding: 3px 10px; cursor: pointer; font-size: 12.5px; }
.btn:hover { border-color: var(--ink); }
.replay { border: 1px solid var(--rule); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }
.replay .view { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.replay .view img { width: 200px; image-rendering: pixelated; border-radius: 4px; background: var(--mat); }
.replay input[type=range] { width: 100%; accent-color: var(--pig); }
.replay ol { list-style: none; margin: 0; padding: 0; font-size: 12.5px; max-height: 180px; overflow-y: auto; }
.replay ol li { padding: 2px 6px; border-radius: 4px; }
.replay ol li.cur { background: var(--surface-2); color: var(--ink); font-weight: 600; }
.replay ol li.skip { color: var(--muted); }

.empty-state { padding: 60px 24px; text-align: center; color: var(--muted); }
.empty-state code { background: var(--surface-2); padding: 2px 6px; border-radius: 4px; color: var(--ink); }

/* ---- critic breakdown ---- */
.critic h4 { margin: 14px 0 6px; font-size: 13px; font-weight: 600; }
table.scales { border-collapse: collapse; font-size: 13px; }
table.scales th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
table.scales td { padding: 6px 8px; border-bottom: 1px solid var(--surface-2); vertical-align: middle; }
table.scales td.num { text-align: right; }
table.scales img { width: 88px; image-rendering: pixelated; border-radius: 3px; display: block; background: var(--mat); }
.err-legend { display: inline-block; width: 64px; height: 8px; border-radius: 2px; vertical-align: middle; margin: 0 4px;
  background: linear-gradient(90deg, #F0E8D6, #C23B21); }

/* ---- model calls ---- */
.live-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.live-call {
  border: 1px solid var(--rule); border-left: 3px solid var(--pig); border-radius: 8px; padding: 10px 12px;
  background: var(--surface); cursor: pointer; text-align: left; display: grid; gap: 6px;
}
.live-call:hover { border-color: var(--pig); }
.lc-head { display: flex; align-items: baseline; gap: 8px; }
.think {
  height: 7.6em; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
  font-size: 12.5px; line-height: 1.52; color: var(--muted); white-space: pre-wrap; word-break: break-word;
}
.thinking {
  white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border-radius: 6px;
  padding: 10px 12px; max-height: 440px; overflow-y: auto; font-size: 13px; line-height: 1.55;
}
.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
tr[data-call] { cursor: pointer; }
tr[data-call]:hover td { background: var(--surface-2); }
.msg { border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px; display: grid; gap: 8px; }
.msg .role { font-size: 12px; color: var(--muted); }
.msg .txt { white-space: pre-wrap; word-break: break-word; font-size: 13px; }
.msg img { width: 180px; image-rendering: pixelated; border-radius: 4px; background: var(--mat); display: block; }
pre.args { margin: 0; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
details > summary { cursor: pointer; color: var(--muted); font-size: 13px; }

@media (max-width: 1000px) {
  .row-2, .detail-grid { grid-template-columns: minmax(0, 1fr); }
  main { padding: 16px 12px 48px; }
  .bar { padding: 10px 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="bar">
  <span class="wordmark">Conveyor</span>
  <label class="sr" for="run-select" hidden>Run</label>
  <select id="run-select" aria-label="Run"></select>
  <span class="runstate" id="runstate"><span class="dot"></span><span id="runstate-text">Loading</span></span>
  <span class="runstate" id="spend"></span>
  <span class="spacer"></span>
  <span class="updated" id="updated"></span>
</div>

<main id="main">
  <section class="panel" aria-labelledby="graph-title">
    <header><h2 id="graph-title">Graph</h2><span class="sub">Each card shows what its node's current champion produces. Select a card to inspect that node.</span></header>
    <div class="graph-wrap"><div id="graph"></div></div>
  </section>

  <div class="row-2" id="row-alarms">
    <section class="panel" aria-labelledby="alarms-title">
      <header><h2 id="alarms-title">Alarms</h2><span class="sub" id="alarms-sub"></span></header>
      <div class="body"><ul class="alarms" id="alarms"></ul></div>
    </section>
    <section class="panel" aria-labelledby="blame-title">
      <header><h2 id="blame-title">Who gets the blame</h2></header>
      <div class="body">
        <div class="sub" id="blame-sub" style="padding:0 0 6px"></div>
        <svg class="chart" id="blame-chart" height="150"></svg>
        <div class="legend" id="blame-legend"></div>
      </div>
    </section>
  </div>

  <section class="panel" id="live-panel" hidden aria-labelledby="live-title">
    <header><h2 id="live-title">Model calls in flight</h2><span class="sub">Thinking streams in as the model writes it. Select a call for the full transcript.</span></header>
    <div class="body" id="live"></div>
  </section>

  <section id="detail" aria-live="polite"></section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="drawer-title"></aside>

<script>
"use strict";

const state = { run: null, node: null, overview: null, detail: null, lastSeq: null, drawer: null, pigments: {},
                call: null, callFrom: null, hasLLM: false };
const $ = (sel, el = document) => el.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmt = (v, d = 3) => v == null || Number.isNaN(v) ? "n/a" : Number(v).toFixed(d);
const short = id => id ? String(id).slice(0, 8) : "";
const signed = (v, d = 3) => v == null ? "n/a" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const art = name => `/artifacts/${name}`;
const usd = v => v == null ? "n/a" : v < 0.01 ? `$${Number(v).toFixed(4)}` : `$${Number(v).toFixed(2)}`;
const spendText = l => l && l.calls
  ? `${usd(l.cost)} on ${l.calls} model call${l.calls === 1 ? "" : "s"}`
    + (l.tokens_cached && l.tokens_in ? `, ${Math.round(100 * l.tokens_cached / l.tokens_in)}% of input cached` : "")
    + (l.errors ? `, ${l.errors} failed` : "")
  : "";
const cachedOf = u => ((u && u.prompt_tokens_details) || {}).cached_tokens;
const pig = name => state.pigments[name] || "var(--pig-4)";

async function api(path) {
  const r = await fetch(path, { cache: "no-store" });
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText);
  return r.json();
}

function readUrl() {
  const p = new URLSearchParams(location.search);
  return { run: p.get("run"), node: p.get("node"), org: p.get("org"), call: p.get("call") };
}
function writeUrl() {
  const p = new URLSearchParams();
  if (state.run) p.set("run", state.run);
  if (state.node) p.set("node", state.node);
  if (state.call) p.set("call", state.call);
  else if (state.drawer) p.set("org", state.drawer);
  history.replaceState(null, "", "?" + p.toString());
}

/* ---------- runs ---------- */

async function loadRuns() {
  const runs = await api("/api/runs");
  const sel = $("#run-select");
  if (!runs.length) {
    $("#main").innerHTML = `<div class="panel empty-state">No runs in this database yet. Start one with <code>uv run conveyor demo</code> and this page fills in as it runs.</div>`;
    $("#runstate-text").textContent = "No runs";
    return false;
  }
  const want = readUrl().run;
  state.run = runs.some(r => r.id === want) ? want : (state.run || runs[0].id);
  sel.innerHTML = runs.map(r => {
    const when = new Date(r.started * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
    return `<option value="${esc(r.id)}"${r.id === state.run ? " selected" : ""}>${esc(r.name)}, ${when}</option>`;
  }).join("");
  return true;
}

$("#run-select").addEventListener("change", e => {
  state.run = e.target.value; state.node = null; state.lastSeq = null; state.detail = null; liveDoneOnce = false;
  $("#graph").innerHTML = "";
  closeDrawer(); writeUrl(); tick(true);
});

/* ---------- polling ---------- */

let ticking = false;
async function tick(force = false) {
  if (ticking || !state.run) return;
  ticking = true;
  try {
    const ov = await api(`/api/runs/${state.run}`);
    state.overview = ov;
    renderRunState(ov);
    // From the run's config too, so the panel is up during the first call, before any call has finished.
    state.hasLLM = !!ov.llm_total || !!(ov.run.config && ov.run.config.painter === "llm");
    $("#live-panel").hidden = !state.hasLLM;
    $("#row-alarms").hidden = !ov.graph;
    if (!ov.graph) { renderGraphless(ov); return; }
    ov.graph.nodes.forEach((n, i) => state.pigments[n.name] = `var(--pig-${i % 5})`);
    if (!state.node || !ov.graph.nodes.some(n => n.name === state.node)) {
      const fromUrl = readUrl().node;
      state.node = ov.graph.nodes.some(n => n.name === fromUrl) ? fromUrl : (ov.graph.nodes.find(n => !n.fixed) || ov.graph.nodes[0]).name;
      writeUrl();
    }
    renderGraph(ov.graph);
    renderAlarms(ov.alarms);
    renderBlame(ov.blame);
    if (force || ov.last_seq !== state.lastSeq) {
      state.lastSeq = ov.last_seq;
      await loadDetail();
    }
    $("#updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  } catch (err) {
    $("#updated").textContent = "Could not reach the server: " + err.message;
  } finally {
    ticking = false;
  }
}

function renderRunState(ov) {

}

/* ---------- graph ---------- */

const CARD_W = 240, CARD_H = 318, COL_GAP = 130, ROW_GAP = 40;

function layoutGraph(g) {
  const names = g.nodes.map(n => n.name);
  const forward = g.edges.filter(e => e.kind !== "feedback");
  const col = Object.fromEntries(names.map(n => [n, 0]));
  for (let pass = 0; pass < names.length; pass++)
    for (const e of forward) if (col[e.dst] < col[e.src] + 1) col[e.dst] = col[e.src] + 1;
  const rows = {};
  const pos = {};
  for (const n of names) {
    const c = col[n]; rows[c] = (rows[c] || 0);
    pos[n] = { x: c * (CARD_W + COL_GAP), y: rows[c] * (CARD_H + ROW_GAP) };
    rows[c]++;
  }
  return pos;
}

function renderGraph(g) {
  const host = $("#graph");
  const pos = layoutGraph(g);
  const feedback = g.edges.filter(e => e.kind === "feedback");
  const maxX = Math.max(...Object.values(pos).map(p => p.x)) + CARD_W;
  const maxY = Math.max(...Object.values(pos).map(p => p.y)) + CARD_H;
  const depth = feedback.length ? 40 + 18 * feedback.length : 0;
  host.style.width = maxX + "px";
  host.style.height = (maxY + depth + 10) + "px";

  let svg = $("svg.edges", host);
  if (!svg) {
    svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("class", "edges");
    host.appendChild(svg);
  }
  svg.setAttribute("width", maxX); svg.setAttribute("height", maxY + depth + 10);
  let paths = "";
  g.edges.forEach((e, i) => {
    const a = pos[e.src], b = pos[e.dst];
    if (!a || !b) return;
    if (e.kind === "feedback") {
      const x1 = a.x + CARD_W / 2 + 20, x2 = b.x + CARD_W / 2 - 20 + (i % 2) * 40;
      const y = Math.max(a.y, b.y) + CARD_H;
      const k = feedback.indexOf(e);
      const dip = y + 34 + k * 18;
      paths += `<path class="edge feedback" d="M${x1},${a.y + CARD_H} C${x1},${dip} ${x2},${dip} ${x2},${b.y + CARD_H}" marker-end="url(#arrow)"/>`;
      // Label near the receiving end, just under the curve, so labels of parallel feedback edges don't collide.
      const t = 0.3, y0 = Math.max(a.y, b.y) + CARD_H;
      const lx = x2 + (x1 - x2) * t;
      const ly = y0 + (dip - y0) * 3 * t * (1 - t) + 15;
      paths += `<text class="edge-label" x="${lx}" y="${ly}" text-anchor="middle">${esc(e.label)}</text>`;
    } else {
      const x1 = a.x + CARD_W, y1 = a.y + CARD_H / 2 - 30, x2 = b.x, y2 = b.y + CARD_H / 2 - 30;
      const mx = (x1 + x2) / 2;
      paths += `<path class="edge" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2 - 2},${y2}" marker-end="url(#arrow)"/>`;
      paths += `<text class="edge-label" x="${mx}" y="${(y1 + y2) / 2 - 8}" text-anchor="middle">${esc(e.label)}</text>`;
    }
  });
  svg.innerHTML = `<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="var(--muted)" stroke-width="1.5"/></marker></defs>` + paths;

  for (const n of g.nodes) {
    let card = host.querySelector(`[data-node="${CSS.escape(n.name)}"]`);
    if (!card) {
      card = document.createElement("button");
      card.className = "node-card";
      card.dataset.node = n.name;
      card.style.setProperty("--pig", pig(n.name));
      card.innerHTML = `<div class="band"></div>
        <div class="head"><span class="name">${esc(n.name)}</span><span class="role">${n.fixed ? "fixed" : "evolving"}</span></div>
        <div class="mat"><span class="empty">No output yet</span></div>
        <div class="facts"><div class="score-row"><span class="score"></span><span class="score-label"></span></div>
        <div class="counts"></div><div class="status"><span class="dot"></span><span class="status-text"></span></div></div>`;
      card.addEventListener("click", () => selectNode(n.name));
      host.appendChild(card);
    }
    card.style.left = pos[n.name].x + "px";
    card.style.top = pos[n.name].y + "px";
    card.setAttribute("aria-pressed", String(state.node === n.name));
    card.title = n.description || "";

    const mat = $(".mat", card);
    if (n.thumbnail) {
      let img = $("img", mat);
      if (!img) { mat.innerHTML = ""; img = document.createElement("img"); img.alt = `${n.name} champion output`; mat.appendChild(img); }
      const src = art(n.thumbnail);
      if (img.getAttribute("src") !== src) img.setAttribute("src", src);
    }
    const ch = n.champion;
    $(".score", card).textContent = ch ? fmt(ch.score) : "";
    if (n.fixed) {
      $(".score-label", card).textContent = ch ? `error map of ${n.mirror} champion` : "";
      $(".score", card).textContent = "";
      $(".counts", card).textContent = `${n.version}. ${n.evaluations} paintings scored.`;
    } else {
      $(".score-label", card).textContent = ch ? `champion ${short(ch.id)}` : "";
      $(".counts", card).textContent = `${n.iterations} iterations, ${n.evaluations} evaluations` + (n.llm ? `. ${spendText(n.llm)}` : "");
    }
    const st = $(".status", card);
    const live = ["evolving", "rescoring", "evaluating initial organism", "checking the held-out painting"].includes(n.status);
    st.classList.toggle("live", live);
    let stText = n.fixed ? "Scores every painting" : n.status === "rescoring" ? `Rescoring after ${n.status_detail.because} changed` : n.status === "evolving" ? "Evolving" : n.status === "idle" ? "Waiting its turn" : n.status;
    $(".status-text", card).textContent = stText.charAt(0).toUpperCase() + stText.slice(1);
  }
}

function selectNode(name) {
  if (state.node === name) return;
  state.node = name; writeUrl();
  document.querySelectorAll(".node-card").forEach(c => c.setAttribute("aria-pressed", String(c.dataset.node === name)));
  loadDetail();
}

function renderBlame(blame) {
  const svg = $("#blame-chart");
  if (!blame || !blame.points.length) { svg.innerHTML = ""; $("#blame-sub").textContent = "No evaluations yet."; return; }
  $("#blame-sub").textContent = `Patches the critic blamed on each component, averaged over every ${blame.window} evaluations.`;
  const xs = blame.points.map(p => p.n);
  const series = blame.keys.map(k => ({ label: k, color: pig(k), values: blame.points.map(p => p[k]) }));

  $("#blame-legend").innerHTML = series.map(s => `<span style="--c:${s.color}">${esc(s.label)}</span>`).join("");
}

/* ---------- charts ---------- */

function scale(d0, d1, r0, r1) { const k = (r1 - r0) / ((d1 - d0) || 1); return v => r0 + (v - d0) * k; }
function niceTicks(lo, hi, n = 4) {
  const span = hi - lo || 1, step0 = span / n, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(s => span / s <= n) || mag * 10;
  const out = []; for (let v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) out.push(+v.toFixed(6));
  return out;
}

function frame(svg, opts) {
  const W = svg.clientWidth || svg.parentElement.clientWidth || 600;
  const H = +svg.getAttribute("height");
  const m = { l: 40, r: 10, t: 8, b: 22 };
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const x = scale(opts.x0, opts.x1, m.l, W - m.r);
  const y = scale(opts.y0, opts.y1, H - m.b, m.t);
  let g = `<g class="grid">`;
  const yt = niceTicks(opts.y0, opts.y1);
  for (const t of yt) g += `<line x1="${m.l}" x2="${W - m.r}" y1="${y(t)}" y2="${y(t)}"/>`;
  g += `</g><g class="axis">`;
  for (const t of yt) g += `<text x="${m.l - 6}" y="${y(t) + 4}" text-anchor="end">${opts.yFmt(t)}</text>`;
  const xt = niceTicks(opts.x0, opts.x1, Math.max(2, Math.floor(W / 90))).filter(t => Number.isInteger(t));
  for (const t of xt) g += `<text x="${x(t)}" y="${H - 5}" text-anchor="middle">${t}</text>`;
  g += `</g>`;
  return { x, y, g, W, H, m };
}

function lineChart(svg, { xs, series, band, markers = [], yMin, yMax, yFmt = v => v.toFixed(2) }) {
  const all = series.flatMap(s => s.values).concat(band ? band.lo.concat(band.hi) : []).filter(v => v != null);
  let y0 = yMin ?? Math.min(...all), y1 = yMax ?? Math.max(...all);
  if (y1 - y0 < 1e-6) { y0 -= 0.01; y1 += 0.01; }
  const pad = (y1 - y0) * 0.08; if (yMin == null) y0 -= pad; y1 += pad;
  const f = frame(svg, { x0: Math.min(...xs), x1: Math.max(...xs, Math.min(...xs) + 1), y0, y1, yFmt });
  let body = f.g;
  if (band) {
    const top = xs.map((v, i) => `${f.x(v)},${f.y(band.hi[i])}`);
    const bot = xs.map((v, i) => `${f.x(v)},${f.y(band.lo[i])}`).reverse();
    body += `<polygon points="${top.concat(bot).join(" ")}" fill="${band.color}" opacity=".16"/>`;
  }
  for (const s of series) {
    const pts = xs.map((v, i) => s.values[i] == null ? null : `${f.x(v)},${f.y(s.values[i])}`).filter(Boolean);
    if (pts.length < 2) {
      // A polyline needs 2+ vertices to paint anything, so a lone point needs an explicit dot.
      body += pts.map(p => `<circle cx="${p.split(",")[0]}" cy="${p.split(",")[1]}" r="3" fill="${s.color}"/>`).join("");
    } else {
      body += `<polyline points="${pts.join(" ")}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" ${s.dash ? `stroke-dasharray="${s.dash}"` : ""} stroke-linejoin="round"/>`;
    }
  }
  for (const mk of markers)
    body += `<circle cx="${f.x(mk.x)}" cy="${f.y(mk.y)}" r="4" fill="var(--surface)" stroke="${mk.color}" stroke-width="2"><title>${esc(mk.title)}</title></circle>`;
  svg.innerHTML = body;
}

function stackedArea(svg, { xs, layers }) {
  const totals = xs.map((_, i) => layers.reduce((s, l) => s + (l.values[i] || 0), 0));
  const f = frame(svg, { x0: Math.min(...xs), x1: Math.max(...xs, Math.min(...xs) + 1), y0: 0, y1: Math.max(1, ...totals) * 1.05, yFmt: v => v.toFixed(0) });
  let body = f.g;
  const base = xs.map(() => 0);
  for (const l of layers) {
    const lo = base.slice();
    xs.forEach((_, i) => base[i] += l.values[i] || 0);
    const top = xs.map((v, i) => `${f.x(v)},${f.y(base[i])}`);
    const bot = xs.map((v, i) => `${f.x(v)},${f.y(lo[i])}`).reverse();
    body += `<polygon points="${top.concat(bot).join(" ")}" fill="${l.color}" opacity="${l.opacity}"><title>${esc(l.label)}</title></polygon>`;
  }
  svg.innerHTML = body;
}

/* ---------- node detail ---------- */

async function loadDetail() {
  const ov = state.overview;
  if (!ov || !ov.graph) return;
  const node = ov.graph.nodes.find(n => n.name === state.node);
  if (!node) return;
  if (node.fixed) { renderFixed(node); return; }
  const [d, calls] = await Promise.all([
    api(`/api/runs/${state.run}/nodes/${encodeURIComponent(node.name)}`),
    node.llm ? api(`/api/runs/${state.run}/calls?node=${encodeURIComponent(node.name)}&limit=25`).catch(() => null) : null,
  ]);
  if (d.node !== state.node) return;
  state.detail = d;
  renderDetail(node, d);
  const host = $("#node-calls");
  if (host && calls) { host.innerHTML = callRows(calls); bindCalls(host); }
}

function detailHead(node) {
  const evolving = state.overview.graph.nodes;
  return `<div class="detail-head" style="--pig:${pig(node.name)}">
    <span class="swatch"></span><h1>${esc(node.name)}</h1><span class="desc">${esc(node.description)}</span>
    <div class="seg" role="group" aria-label="Node">${evolving.map(n => `<button data-sel="${esc(n.name)}" aria-pressed="${n.name === node.name}">${esc(n.name)}</button>`).join("")}</div>
  </div>`;
}
function bindHead(root) { root.querySelectorAll("[data-sel]").forEach(b => b.addEventListener("click", () => selectNode(b.dataset.sel))); }

/* The critic's score with its working shown: one table per target, one row per resolution. */
function criticSection(reports, opts = {}) {
  if (!reports || !reports.length) return "";
  const ceiling = reports[0].rmse_ceiling;
  const img = (name, alt) => name ? `<img src="${art(name)}" alt="${esc(alt)}">` : `<span class="quiet">not recorded</span>`;
  return `<section class="critic"><h3>How the critic scored it</h3>
    <p class="quiet" style="margin:0 0 4px;max-width:75ch">The pixel score compares the painting with the target at three resolutions, all drawn at the same size so you can see what each one keeps. Coarse rows forgive a stroke that lands a few pixels off but still punish a missing one, so they count for more. A row's score is 1 − RMSE ÷ ${ceiling}, and never below 0.</p>
    <p class="quiet" style="margin:0">Error maps: match<span class="err-legend" aria-hidden="true"></span>RMSE of ${ceiling} or more.</p>
    ${reports.map(r => `<h4>${esc(r.target.replace(/_/g, " "))}${r.train === false ? ", held out" : r.train ? ", training" : ""}</h4>
      <div style="overflow-x:auto"><table class="scales">
        <thead><tr><th>Resolution</th><th>Target</th><th>Painting</th><th>Error</th><th>RMSE</th><th>Score</th><th>Weight</th><th>Adds</th></tr></thead>
        <tbody>${r.scales.map(s => `<tr>
          <td><b>${esc(s.name)}</b><div class="quiet">${s.size[0]} × ${s.size[1]}</div></td>
          <td>${img(s.target, `Target at ${s.name.toLowerCase()} resolution`)}</td>
          <td>${img(s.canvas, `Painting at ${s.name.toLowerCase()} resolution`)}</td>
          <td>${img(s.error, `Error at ${s.name.toLowerCase()} resolution`)}</td>
          <td class="num">${fmt(s.rmse)}</td><td class="num">${fmt(s.score)}</td>
          <td class="num">${Math.round(s.weight * 100)}%</td><td class="num"><b>${fmt(s.contribution)}</b></td></tr>`).join("")}
        </tbody></table></div>
      <p style="margin:6px 0 0">Pixel <b>${fmt(r.pixel)}</b> is the sum of the last column. Style <b>${fmt(r.style)}</b>.
        Total: ${r.pixel_weight} × ${fmt(r.pixel)} + ${r.style_weight} × ${fmt(r.style)} = <b>${fmt(r.total)}</b>.</p>`).join("")}
    ${opts.note ? `<p class="quiet" style="margin:8px 0 0">${esc(opts.note)}</p>` : ""}
  </section>`;
}

// Last rendered critic breakdown on the critic page, shown again while a refresh loads so the page doesn't flicker.
let criticCache = { id: null, html: "" };

async function renderFixed(node) {
  const root = $("#detail");
  const id = node.champion && node.champion.id;
  root.innerHTML = `${detailHead(node)}
    <div class="panel" style="margin-top:16px"><div class="body" style="padding-top:16px">
      <p style="margin-top:0;max-width:75ch">The ${esc(node.name)} doesn't evolve. It runs version <b>${esc(node.version)}</b> and has scored ${node.evaluations} paintings in this run. Its scores and blame decisions show up on the nodes it feeds back into.</p>
      <div id="critic-champion">${id && criticCache.id === id ? criticCache.html
        : `<p class="quiet">${id ? `Loading the current ${esc(node.mirror)} champion's score.` : "No paintings scored yet."}</p>`}</div>
    </div></div>`;
  bindHead(root);
  const bind = () => $("#critic-champion").querySelectorAll("[data-org]").forEach(b => b.addEventListener("click", () => openDrawer(b.dataset.org)));
  bind();
  if (!id) return;
  let html;
  try {
    const o = await api(`/api/runs/${state.run}/organisms/${id}`);
    const latest = o.evaluations[o.evaluations.length - 1];
    const held = (o.holdouts || []).at(-1);
    const reports = [...((latest && latest.details && latest.details.critic) || []),
                     ...((held && held.details && held.details.critic) || [])];
    html = `<p style="max-width:75ch">These are the scores for the current ${esc(node.mirror)} champion, <button class="linkish" data-org="${esc(id)}">${short(id)}</button>, from its latest evaluation.</p>`
      + (reports && reports.length ? criticSection(reports)
        : `<p class="quiet">That evaluation has no breakdown. Runs recorded before the breakdown was added don't have one.</p>`);
  } catch (err) {
    html = `<p class="quiet">Could not load the champion: ${esc(err.message)}</p>`;
  }
  if (state.node !== node.name || !$("#critic-champion")) return;
  criticCache = { id, html };
  $("#critic-champion").innerHTML = html;
  bind();
}

function openCritic(row) {
  if (!document.activeElement || !$("#drawer").contains(document.activeElement)) lastFocus = document.activeElement;
  state.drawer = null; state.call = null; clearTimeout(callTimer); writeUrl();
  const dr = $("#drawer");
  dr.dataset.call = "";
  dr.hidden = false; $("#scrim").hidden = false;
  dr.style.setProperty("--pig", pig(row.harness));
  dr.innerHTML = `<div class="top"><span class="swatch"></span><h1 id="drawer-title">${esc(row.harness)} painting #${row.repeat + 1}</h1><button class="close" id="drawer-close">Close</button></div>`
    + criticSection([row.critic]);
  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#drawer-close").focus();
}

function keepScroll(fn) {
  const saved = [...document.querySelectorAll("#detail [data-keep]")].map(el => [el.dataset.keep, el.scrollTop, el.scrollLeft]);
  fn();
  for (const [k, t, l] of saved) { const el = document.querySelector(`#detail [data-keep="${k}"]`); if (el) { el.scrollTop = t; el.scrollLeft = l; } }
}

function renderDetail(node, d) {
  keepScroll(() => {
    const root = $("#detail");
    root.style.setProperty("--pig", pig(node.name));
    root.innerHTML = `${detailHead(node)}
    <div class="detail-grid" style="margin-top:16px">
      <div class="stack">
        <section class="panel"><header><h2>Score</h2><span class="sub">Best organism, median, and the middle half of the population at each iteration. Rings mark new champions.</span></header>
          <div class="body"><svg class="chart" id="score-chart" height="230"></svg><div class="legend" id="score-legend"></div></div></section>
        <section class="panel"><header><h2>Failures by type</h2><span class="sub">Trainable failures blamed on this node, summed over the organisms evaluated in each iteration.</span></header>
          <div class="body"><svg class="chart" id="mix-chart" height="160"></svg><div class="legend" id="mix-legend"></div></div></section>
        <section class="panel"><header><h2>Lineage</h2><span class="sub">${d.lineage.length} organisms. Darker means a higher score. Hollow red rings were not viable. The black ring is the champion. Dashed lines are crossover.</span></header>
          <div class="lineage-wrap" data-keep="lineage"><svg class="lineage" id="lineage"></svg></div></section>
      </div>
      <div class="stack">
        <section class="panel"><header><h2>Mutators</h2><span class="sub">How often each mutator's children beat their parent.</span></header>
          <div class="body" style="overflow-x:auto">${mutatorTable(d.mutators)}</div></section>
        <section class="panel"><header><h2>Learning log</h2><span class="sub">What each mutator tried and what happened, newest first.</span></header>
          <div class="body"><ul class="feed" data-keep="feed">${feedItems(d.feed)}</ul></div></section>
        <section class="panel"><header><h2>Rescores</h2><span class="sub">Stored scores replaced after a partner's champion changed.</span></header>
          <div class="body">${rescoreList(d.rescores)}</div></section>
        ${node.llm ? `<section class="panel"><header><h2>Model calls</h2><span class="sub">This node's most recent calls, painting and mutating. Select one for the transcript.</span></header>
          <div class="body" style="overflow-x:auto" id="node-calls"><p class="quiet">Loading.</p></div></section>` : ""}
      </div>
    </div>`;
    bindHead(root);

    const its = d.iterations;
    const xs = its.map(i => i.iteration);
    const P = k => its.map(i => i.percentiles ? i.percentiles[k] : null);
    const champIters = new Map(d.champions.map(c => [c.iteration ?? 0, c]));
    const markers = its.filter(i => champIters.has(i.iteration)).map(i => ({ x: i.iteration, y: i.best_score, color: pig(node.name), title: `New champion ${short(champIters.get(i.iteration).id)} at iteration ${i.iteration}` }));
    lineChart($("#score-chart"), {
      xs, band: { lo: P("25"), hi: P("75"), color: pig(node.name) },
      series: [{ label: "best", color: pig(node.name), values: its.map(i => i.best_score), width: 2.5 }, { label: "median", color: "var(--muted)", values: P("50"), width: 1.5, dash: "4 3" }],
      markers, yFmt: v => v.toFixed(2),
    });
    $("#score-legend").innerHTML = `<span style="--c:${pig(node.name)}">best</span><span style="--c:var(--muted)">median</span><span class="area" style="--c:${pig(node.name)}">25th to 75th percentile</span>`;

    const mix = d.failure_mix;
    if (mix.points.length) {
      const opac = [0.9, 0.55, 0.28, 0.14];
      const layers = mix.types.map((t, i) => ({ label: t, color: pig(node.name), opacity: opac[i % opac.length], values: mix.points.map(p => p[t]) }));
      stackedArea($("#mix-chart"), { xs: mix.points.map(p => p.iteration), layers });
      $("#mix-legend").innerHTML = layers.map(l => `<span class="area" style="--c:color-mix(in oklab, ${l.color} ${Math.round(l.opacity * 100)}%, var(--surface))">${esc(l.label.replace(/_/g, " "))}</span>`).join("");
    } else {
      $("#mix-chart").outerHTML = `<p class="quiet">No failures blamed on ${esc(node.name)} yet.</p>`;
    }

    renderLineage($("#lineage"), d, node);
    root.querySelectorAll("[data-org]").forEach(b => b.addEventListener("click", () => openDrawer(b.dataset.org)));
  });
}

function mutatorTable(rows) {
  if (!rows.length) return `<p class="quiet">No mutations yet.</p>`;
  const hasVerify = rows.some(r => r.verify_total);
  const hasCost = rows.some(r => r.model_calls);
  return `<table class="yield"><thead><tr><th>Mutator</th><th>Children</th><th>Not viable</th>${hasVerify ? "<th>Passed verify</th>" : ""}<th>Beat parent</th><th>Mean change</th>${hasCost ? "<th>Model cost</th>" : ""}</tr></thead><tbody>
    ${rows.map(r => {
      const n = r.comparable;
      const rate = n ? r.improved / n : 0;
      const vr = r.verify_total ? r.verify_pass / r.verify_total : null;
      const skipped = r.partner_changed ? `<div class="quiet" style="font-size:12px">${r.partner_changed} not comparable</div>` : "";
      return `<tr><td>${esc(r.mutator)}${r.errors ? ` <span class="down" title="calls that raised">${r.errors} errors</span>` : ""}</td>
        <td>${r.children}</td>
        <td class="${r.evaluated && r.nonviable / r.evaluated > 0.3 ? "bad" : ""}">${r.nonviable}</td>
        ${hasVerify ? `<td class="${vr != null && vr < 0.1 && r.verify_total >= 10 ? "bad" : ""}">${r.verify_total ? `${r.verify_pass} of ${r.verify_total}` : "n/a"}</td>` : ""}
        <td class="${n >= 12 && rate < 0.05 ? "bad" : rate >= 0.25 ? "good" : ""}">${r.improved} of ${n}<span class="bar-cell"><i style="width:${Math.round(rate * 100)}%"></i></span>${skipped}</td>
        <td>${signed(r.mean_delta)}</td>${hasCost ? `<td>${r.model_calls ? `${usd(r.model_cost)}<div class="quiet" style="font-size:12px">${r.model_calls} calls</div>` : "none"}</td>` : ""}</tr>`;
    }).join("")}</tbody></table>
    <p class="quiet" style="margin:8px 0 0">A child only counts against its parent when both were scored against the same partner versions. Otherwise the partner's progress would show up as the mutator's.</p>`;
}

function feedItems(feed) {
  if (!feed.length) return `<li class="quiet">Nothing tried yet.</li>`;
  return feed.map(f => {
    let outcome;
    if (f.verified === false) outcome = `<span class="down">Failed verification, not evaluated</span>`;
    else if (f.score == null) outcome = `<span class="quiet">Waiting for evaluation</span>`;
    else if (f.viable === false) outcome = `<span class="down">Not viable</span>`;
    else if (f.compare === "ok") {
      outcome = `Scored ${fmt(f.score)}, <span class="${f.delta > 0 ? "up" : f.delta < 0 ? "down" : ""}">${signed(f.delta)}</span> against parent`;
    } else if (f.compare === "partner_changed") {
      outcome = `Scored ${fmt(f.score)}. The parent was scored against an older partner, so there's no fair comparison`;
    } else {
      outcome = `Scored ${fmt(f.score)}`;
    }
    return `<li><button class="summary" data-org="${esc(f.id)}">${esc(f.summary)}</button>
      <div class="meta">${outcome}. ${esc(f.mutator)}, iteration ${f.iteration}.</div></li>`;
  }).join("");
}

function rescoreList(rs) {
  if (!rs.length) return `<p class="quiet">No rescores yet. They happen when a partner node crowns a new champion.</p>`;
  return `<ul class="rescores">${rs.map(r => {
    const dlt = r.new_score - r.old_score;
    return `<li><button class="linkish" data-org="${esc(r.id)}">${short(r.id)}</button>
      <span>${fmt(r.old_score)} to ${fmt(r.new_score)} <span class="${dlt > 0.0005 ? "up" : dlt < -0.0005 ? "down" : "quiet"}">${signed(dlt)}</span></span>
      <span class="quiet">${esc(r.because)} changed</span></li>`;
  }).join("")}</ul>`;
}

function renderLineage(svg, d, node) {
  const orgs = d.lineage;
  if (!orgs.length) { svg.outerHTML = `<p class="quiet" style="padding:0 16px">No organisms yet.</p>`; return; }
  const byId = new Map(orgs.map(o => [o.id, o]));
  const gens = new Map();
  for (const o of orgs) { if (!gens.has(o.generation)) gens.set(o.generation, []); gens.get(o.generation).push(o); }
  const SP = 20, ROW = 46, PAD = 40;
  const maxCount = Math.max(...[...gens.values()].map(g => g.length));
  const wrapW = svg.parentElement.clientWidth || 700;
  const W = Math.max(wrapW, maxCount * SP + PAD * 2);
  const x = new Map();
  const sortedGens = [...gens.keys()].sort((a, b) => a - b);
  for (const gi of sortedGens) {
    const row = gens.get(gi);
    row.sort((a, b) => ((x.get(a.parent_id) ?? 0) - (x.get(b.parent_id) ?? 0)) || (a.iteration - b.iteration));
    const span = Math.max(1, row.length - 1) * SP;
    const center = row.reduce((s, o) => s + (x.get(o.parent_id) ?? W / 2), 0) / row.length;
    let start = Math.min(Math.max(PAD, center - span / 2), W - PAD - span);
    row.forEach((o, i) => x.set(o.id, row.length === 1 ? Math.min(Math.max(PAD, center), W - PAD) : start + i * SP));
  }
  const H = (sortedGens.length) * ROW + 30;
  const scores = orgs.filter(o => o.viable).map(o => o.score);
  const lo = Math.min(...scores), hi = Math.max(...scores);
  const y = o => 20 + sortedGens.indexOf(o.generation) * ROW;
  svg.setAttribute("width", W); svg.setAttribute("height", H);
  let s = "";
  for (const gi of sortedGens) s += `<text x="4" y="${20 + sortedGens.indexOf(gi) * ROW + 4}">gen ${gi}</text>`;
  for (const o of orgs) {
    const p = byId.get(o.parent_id);
    if (p) s += `<line x1="${x.get(p.id)}" y1="${y(p)}" x2="${x.get(o.id)}" y2="${y(o)}"/>`;
    for (const ap of o.additional_parent_ids || []) {
      const q = byId.get(ap);
      if (q) s += `<path class="cross" d="M${x.get(q.id)},${y(q)} Q${(x.get(q.id) + x.get(o.id)) / 2},${(y(q) + y(o)) / 2 - 20} ${x.get(o.id)},${y(o)}"/>`;
    }
  }
  for (const o of orgs) {
    const t = hi > lo ? (o.score - lo) / (hi - lo) : 1;
    const fill = o.viable ? `color-mix(in oklab, ${pig(node.name)} ${Math.round(12 + t * 88)}%, var(--surface))` : "var(--surface)";
    const stroke = !o.viable ? "var(--alarm)" : o.id === d.champion_id ? "var(--ink)" : "transparent";
    const r = o.id === d.champion_id ? 8 : 6;
    const tip = `${short(o.id)}, ${o.mutator || "initial"}\n${o.viable ? "score " + fmt(o.score) : "not viable"}${o.n_evals > 1 ? `\nrescored ${o.n_evals - 1} times, first ${fmt(o.first_score)}` : ""}`;
    s += `<circle cx="${x.get(o.id)}" cy="${y(o)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${o.id === d.champion_id ? 2.5 : 2}" data-org="${esc(o.id)}" tabindex="0" role="button" aria-label="${esc(tip.replace(/\n/g, ", "))}"><title>${esc(tip)}</title></circle>`;
  }
  svg.innerHTML = s;
  svg.querySelectorAll("circle").forEach(c => c.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDrawer(c.dataset.org); } }));
}

let lastFocus = null;
async function openDrawer(oid) {
  if (!document.activeElement || !$("#drawer").contains(document.activeElement)) lastFocus = document.activeElement;
  state.drawer = oid; state.call = null; clearTimeout(callTimer); writeUrl();
  const dr = $("#drawer");
  dr.dataset.call = "";
  dr.hidden = false; $("#scrim").hidden = false;
  dr.innerHTML = `<div class="top"><h1 id="drawer-title">Loading ${short(oid)}</h1><button class="close" id="drawer-close">Close</button></div>`;
  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#drawer-close").focus();
  try {
    const [o, calls] = await Promise.all([
      api(`/api/runs/${state.run}/organisms/${oid}`),
      state.hasLLM ? api(`/api/runs/${state.run}/calls?organism=${oid}&limit=200`).catch(() => []) : [],
    ]);
    if (state.drawer !== oid) return;
    renderDrawer(o, calls);
  } catch (err) {
    dr.innerHTML = `<div class="top"><h1 id="drawer-title">Organism ${short(oid)}</h1><button class="close" id="drawer-close">Close</button></div><p>Could not load it: ${esc(err.message)}</p>`;
    $("#drawer-close").addEventListener("click", closeDrawer);
  }
}
function closeDrawer() {
  state.drawer = null; state.call = null; state.callFrom = null; clearTimeout(callTimer); writeUrl();
  $("#drawer").dataset.call = "";
  $("#drawer").hidden = true; $("#scrim").hidden = true;
  if (lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
$("#scrim").addEventListener("click", closeDrawer);
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#drawer").hidden) closeDrawer(); });

function diffLines(a, b) {
  const A = a.split("\n"), B = b.split("\n"), n = A.length, m = B.length;
  const L = Array.from({ length: n + 1 }, () => new Int32Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (A[i] === B[j]) { out.push([" ", A[i]]); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push(["-", A[i++]]);
    else out.push(["+", B[j++]]);
  }
  while (i < n) out.push(["-", A[i++]]);
  while (j < m) out.push(["+", B[j++]]);
  return out;
}

function renderDrawer(o, calls = []) {
  const dr = $("#drawer");
  // Model calls made while evaluating this organism, grouped by evaluation (trace), oldest first.
  const byTrace = {};
  for (const c of calls.slice().reverse()) if (c.trace_id) (byTrace[c.trace_id] ||= []).push(c);
  const hasCalls = Object.keys(byTrace).length > 0;
  dr.style.setProperty("--pig", pig(o.node));
  const latest = o.evaluations[o.evaluations.length - 1];
  const first = o.evaluations[0];
  const subs = latest ? latest.sub_scores || {} : {};
  const kv = [];
  if (latest) kv.push([latest.viable ? fmt(latest.score) : "not viable", o.evaluations.length > 1 ? "score now" : "score"]);
  if (o.evaluations.length > 1) kv.push([fmt(first.score), "first score"]);
  if (o.parent && o.parent.score != null) kv.push([fmt(o.parent.score), "parent now"]);
  for (const [k, v] of Object.entries(subs)) kv.push([typeof v === "number" && !Number.isInteger(v) ? fmt(v) : v, k.replace(/_/g, " ")]);
  // Held-out targets are painted once, when an organism becomes champion.
  const held = (o.holdouts || []).at(-1);
  if (held && held.score != null) kv.push([fmt(held.score), "held-out score"]);

  let html = `<div class="top"><span class="swatch"></span><h1 id="drawer-title">${esc(o.node)} ${short(o.id)}</h1><button class="close" id="drawer-close">Close</button></div>
    <div class="quiet">Generation ${o.generation}, ${o.mutator ? `made by ${esc(o.mutator)}` : "initial organism"}, iteration ${o.iteration}.${o.is_champion ? " <b style=\"color:var(--ink)\">Current champion.</b>" : ""}</div>
    <div class="kv">${kv.map(([v, k]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("")}</div>`;

  if (latest && latest.notes) html += `<div class="change" style="border-left:3px solid var(--alarm)">${latest.notes.map(esc).join("<br>")}</div>`;
  if (latest && latest.error) html += `<div class="change" style="border-left:3px solid var(--alarm)">Evaluation raised ${esc(latest.error)}</div>`;

  if (o.change_summary || o.parent) {
    html += `<section><h3>What changed</h3>`;
    if (o.change_summary) html += `<div class="change">${esc(o.change_summary)}</div>`;
    const parents = [];
    if (o.parent_id) parents.push(`parent <button class="linkish" data-org="${esc(o.parent_id)}">${short(o.parent_id)}</button>`);
    for (const ap of o.additional_parent_ids || []) parents.push(`crossover with <button class="linkish" data-org="${esc(ap)}">${short(ap)}</button>`);
    if (parents.length) html += `<p class="quiet" style="margin:6px 0 0">From ${parents.join(", ")}.${o.verified === false ? " Failed verification, so it was never evaluated." : o.verified ? " Passed verification." : ""}</p>`;
    html += `</section>`;
  }

  if (o.llm_call_ids && o.llm_call_ids.length) {
    const n = o.llm_call_ids.length;
    html += `<section><h3>Written by a model call</h3><p class="quiet" style="margin:0 0 8px">${esc(o.mutator)} asked the model for this change. The transcript shows what it was told, how it reasoned, and what it returned.</p>
      ${o.llm_call_ids.map((id, i) => `<button class="btn" data-call="${esc(id)}">${n > 1 ? `Open call ${i + 1}` : "Open the call"}</button>`).join(" ")}</section>`;
  }

  if (o.parent) {
    const lines = diffLines(o.parent.text, o.text);
    const changed = lines.some(l => l[0] !== " ");
    html += `<section><h3>Diff against parent</h3>${changed ? `<pre class="diff mono">${lines.map(([t, s]) => `<div class="${t === "+" ? "add" : t === "-" ? "del" : "same"}">${t} ${esc(s)}</div>`).join("")}</pre>` : `<p class="quiet">Identical to the parent.</p>`}</section>`;
  } else {
    html += `<section><h3>Definition</h3><pre class="diff mono">${o.text.split("\n").map(s => `<div class="same">${esc(s)}</div>`).join("")}</pre></section>`;
  }

  if (latest && latest.artifacts) {
    const a = latest.artifacts;
    const reports = latest.details && latest.details.critic;
    // With a critic breakdown the error maps live there, at every resolution, so skip the single one here.
    const kinds = reports && reports.length ? /^(canvas|oracle)_/ : /^(canvas|oracle|heat)_/;
    const figs = Object.entries(a).filter(([k]) => kinds.test(k)).map(([k, v]) => {
      const [kind, ...rest] = k.split("_");
      const label = { canvas: "painting", oracle: "oracle's best", heat: "error" }[kind] + ", " + rest.join(" ");
      return `<figure><img src="${art(v)}" alt="${esc(label)}"><figcaption>${esc(label)}</figcaption></figure>`;
    });
    if (a.thumb && o.node !== "agent") figs.unshift(`<figure><img src="${art(a.thumb)}" alt="Output"><figcaption>${esc(o.node)} output</figcaption></figure>`);
    if (figs.length) html += `<section><h3>Output from the latest evaluation</h3><div class="canvases">${figs.join("")}</div></section>`;
  }

  const reports = [...((latest && latest.details && latest.details.critic) || []),
                   ...((held && held.details && held.details.critic) || [])];
  if (reports.length) {
    const train = reports.filter(r => r.train);
    const averaged = train.length === 1 && latest.viable && Math.abs(train[0].total - latest.score) > 0.0005;
    html += criticSection(reports, {
      note: averaged ? `This breakdown is for the painting made with the partner's current champion. The organism's score, ${fmt(latest.score)}, averages every painting made with its partners.` : "",
    });
  }

  const fails = latest ? latest.failures.filter(f => f.triptych) : [];
  if (fails.length) {
    html += `<section><h3>Failing patches</h3><p class="quiet" style="margin:0 0 8px">Each strip shows the target, the oracle's best with these tools, and the painting. ${latest.n_trainable} trainable failures in total.</p>
      <div class="trips">${fails.map(f => `<figure><img src="${art(f.triptych)}" alt="Patch ${esc(f.data_point_id)}"><figcaption>${esc(f.data_point_id)}, ${esc(f.failure_type.replace(/_/g, " "))}. Oracle ${fmt(f.oracle_err)}, painting ${fmt(f.agent_err)}.</figcaption></figure>`).join("")}</div></section>`;
  }

  html += `<section><h3>Evaluations</h3><table class="evals"><thead><tr><th>Why</th><th>Score</th><th>Measured against</th>${hasCalls ? "<th>Model calls</th>" : ""}<th></th></tr></thead><tbody>
    ${[...o.evaluations, ...(o.holdouts || []).map(h => ({ ...h, reason: "held-out check", viable: !h.error && h.score != null }))]
      .sort((a, b) => a.seq - b.seq).map((e, i) => `<tr><td>${esc(e.reason)}<div class="quiet">${fmt(e.duration, 2)}s, ${e.n_spans} tool calls</div></td>
      <td>${e.viable ? fmt(e.score) : "not viable"}</td>
      <td>${Object.entries(e.partners || {}).map(([n, ids]) => `${esc(n)} ${ids.map(id => `<button class="linkish" data-org="${esc(id)}">${short(id)}</button>`).join(" ")}`).join("<br>") || "nothing"}</td>
      ${hasCalls ? `<td>${(byTrace[e.trace_id] || []).map((c, j) => `<button class="linkish" data-call="${esc(c.id)}" title="${esc(c.purpose)}, ${esc(c.status)}">${j + 1}</button>`).join(" ") || "none"}</td>` : ""}
      <td>${e.n_spans ? `<button class="btn" data-trace="${esc(e.trace_id)}">Replay</button>` : ""}</td></tr>`).join("")}
    </tbody></table><div id="replay-host"></div></section>`;

  if (o.children.length) {
    html += `<section><h3>Children</h3><ul class="rescores">${o.children.map(c => `<li><button class="linkish" data-org="${esc(c.id)}">${short(c.id)}</button><span>${c.viable === false ? '<span class="down">not viable</span>' : fmt(c.score)}</span><span class="quiet">${esc(c.mutator)}</span></li>`).join("")}</ul></section>`;
  }

  dr.innerHTML = html;
  $("#drawer-close").addEventListener("click", closeDrawer);
  dr.querySelectorAll("[data-org]").forEach(b => b.addEventListener("click", () => openDrawer(b.dataset.org)));
  dr.querySelectorAll("[data-trace]").forEach(b => b.addEventListener("click", () => showReplay(b.dataset.trace, o.id)));
  dr.querySelectorAll("[data-call]").forEach(b => b.addEventListener("click", () => openCall(b.dataset.call, o.id)));
  const replayable = o.evaluations.filter(e => e.n_spans);
  if (replayable.length) showReplay(replayable[replayable.length - 1].trace_id, o.id);
}

async function showReplay(traceId, orgId) {
  const host = $("#replay-host");
  host.innerHTML = `<p class="quiet">Loading tool calls.</p>`;
  const t = await api(`/api/traces/${traceId}`);
  const spans = t.spans;
  if (!spans.length) { host.innerHTML = ""; return; }
  const thumbAt = []; let lastThumb = null;
  for (const s of spans) { if (s.artifact) lastThumb = s.artifact; thumbAt.push(lastThumb); }
  host.innerHTML = `<div class="replay" style="margin-top:12px">
    <h3 style="margin:0">Replay: ${spans.length} tool calls</h3>
    <div class="view"><img id="replay-img" alt="Canvas during the run"><div id="replay-meta" style="flex:1;min-width:200px"></div></div>
    <input type="range" id="replay-range" min="0" max="${spans.length - 1}" value="${spans.length - 1}" aria-label="Tool call">
    <ol id="replay-list"></ol></div>`;
  const show = i => {
    const s = spans[i];
    $("#replay-img").src = thumbAt[i] ? art(thumbAt[i]) : "";
    const args = Object.entries(s.args || {}).map(([k, v]) => `${k} ${v}`).join(", ");
    const res = s.result || {};
    let body;
    if (s.name.startsWith("model call")) {
      body = `<div>${res.prompt_tokens} tokens in, ${res.completion_tokens} out, ${usd(res.cost)}, ${fmt(s.duration, 1)}s. ${res.n_tool_calls} brush calls.</div>
        ${res.error ? `<div class="down">${esc(res.error)}</div>` : ""}
        ${res.reasoning ? `<div class="quiet" style="margin-top:6px;white-space:pre-wrap">${esc(res.reasoning)}</div>` : ""}
        ${res.text ? `<div style="margin-top:6px;white-space:pre-wrap">${esc(res.text)}</div>` : ""}`;
    } else if (res.error) {
      body = `<div class="down">Rejected: ${esc(res.error)}</div>`;
    } else {
      body = `<div>${res.kept ? `Kept, error ${signed(res.delta_error, 4)}` : `Discarded${res.delta_error != null ? `, it would have changed error by ${signed(res.delta_error, 4)}` : ""}`}</div>`;
    }
    // The model call that produced this stroke is the nearest model-call span at or before it.
    let source = null;
    for (let k = i; k >= 0; k--) if (spans[k].name.startsWith("model call")) { source = spans[k]; break; }
    const callId = source && source.args && source.args.call_id;
    $("#replay-meta").innerHTML = `<div><b>Call ${i + 1} of ${spans.length}: ${esc(s.name)}</b></div><div class="quiet">${esc(args)}</div>
      ${body}<div class="quiet" style="margin-top:6px">The canvas shows the last snapshot at or before this call.</div>
      ${callId ? `<div style="margin-top:8px"><button class="btn" data-call="${esc(callId)}">${s === source ? "Open this model call" : "Open the model call behind this stroke"}</button></div>` : ""}`;
    const link = $("#replay-meta [data-call]");
    if (link) link.addEventListener("click", () => openCall(link.dataset.call, orgId));
    const lo = Math.max(0, i - 6), hi = Math.min(spans.length, i + 7);
    $("#replay-list").innerHTML = spans.slice(lo, hi).map(sp => `<li class="${sp.idx === i ? "cur" : ""} ${sp.result && !sp.result.kept ? "skip" : ""}">${sp.idx + 1}. ${esc(sp.name)}${sp.args && sp.args.color ? ` <span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${esc(sp.args.color)};vertical-align:middle"></span>` : ""}${sp.result && sp.result.delta_error != null ? ` ${signed(sp.result.delta_error, 4)}` : ""}${sp.result && sp.result.cost != null ? ` ${usd(sp.result.cost)}` : ""}</li>`).join("");
  };
  $("#replay-range").addEventListener("input", e => show(+e.target.value));
  show(spans.length - 1);
}

/* ---------- model calls ---------- */

const clock = t => new Date(t * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });

function bindCalls(root, from = null) {
  root.querySelectorAll("[data-call]").forEach(el => {
    el.addEventListener("click", () => openCall(el.dataset.call, from));
    if (el.tagName === "TR") el.addEventListener("keydown", e => { if (e.key === "Enter") openCall(el.dataset.call, from); });
  });
}

function callRows(calls) {
  if (!calls.length) return `<p class="quiet">No model calls yet.</p>`;
  return `<table class="evals"><thead><tr><th>Started</th><th>What</th><th>Tokens in, out</th><th>Cost</th><th>Time</th></tr></thead><tbody>
    ${calls.map(c => {
      const u = c.usage || {};
      const dur = (c.ended || Date.now() / 1000) - c.started;
      const status = c.status === "running" ? ` <span class="up">running</span>` : c.status === "error" ? ` <span class="down">failed</span>` : "";
      return `<tr data-call="${esc(c.id)}" tabindex="0"><td>${clock(c.started)}</td>
        <td>${esc(c.mutator || c.purpose)}${c.node ? ` <span class="quiet">${esc(c.node)}</span>` : ""}${status}
          ${c.reasoning_head ? `<div class="quiet clamp" style="font-size:12px">${esc(c.reasoning_head)}</div>` : ""}</td>
        <td>${u.prompt_tokens ?? ""}${cachedOf(u) ? ` <span class="quiet">(${cachedOf(u)} cached)</span>` : ""}, ${u.completion_tokens ?? ""}</td><td>${usd(u.cost)}</td><td>${fmt(dur, 1)}s</td></tr>`;
    }).join("")}</tbody></table>`;
}

let liveBusy = false, liveDoneOnce = false;
async function loadLive() {
  if (!state.hasLLM || !state.run || liveBusy || document.hidden) return;
  const finished = !!(state.overview && state.overview.finished);
  if (finished && liveDoneOnce) return;
  liveBusy = true;
  try { renderLive(await api(`/api/runs/${state.run}/live`)); liveDoneOnce = finished; }
  catch { /* the next tick tries again */ }
  finally { liveBusy = false; }
}

function renderLive(d) {
  const host = $("#live");
  if (!d.running.length) {
    host.innerHTML = `<p class="quiet" style="margin-top:0">No model calls in flight right now.${d.recent.length ? " The most recent ones:" : ""}</p>${d.recent.length ? callRows(d.recent) : ""}`;
    bindCalls(host);
    return;
  }
  host.innerHTML = `<div class="live-grid">${d.running.map(c => `<button class="live-call" data-call="${esc(c.id)}" style="--pig:${pig(c.node)}">
      <div class="lc-head"><b>${esc(c.node || "unattributed")}</b><span>${esc(c.mutator || c.purpose)}</span><span class="quiet" style="margin-left:auto">${fmt(d.now - c.started, 0)}s</span></div>
      <div class="think">${c.reasoning_tail ? esc(c.reasoning_tail) : `<span>${c.first_token ? "Writing its reply." : "Waiting for the first token."}</span>`}</div>
      <div class="quiet" style="font-size:12px">${c.reasoning_chars.toLocaleString()} characters of thinking${c.n_tool_calls ? `, ${c.n_tool_calls} tool calls so far` : ""}</div>
    </button>`).join("")}</div>`;
  bindCalls(host);
}

let callTimer = null;
async function openCall(id, from = null) {
  if (!document.activeElement || !$("#drawer").contains(document.activeElement)) lastFocus = document.activeElement;
  state.call = id; state.callFrom = from; state.drawer = null; writeUrl();
  const dr = $("#drawer");
  dr.hidden = false; $("#scrim").hidden = false;
  if (dr.dataset.call !== id) {
    dr.dataset.call = id;
    dr.innerHTML = `<div class="top"><h1 id="drawer-title">Loading the model call</h1><button class="close" id="drawer-close">Close</button></div>`;
    $("#drawer-close").addEventListener("click", closeDrawer);
  }
  await refreshCall(true);
}

async function refreshCall(first = false) {
  clearTimeout(callTimer);
  const id = state.call;
  if (!id) return;
  let c;
  try { c = await api(`/api/calls/${id}`); }
  catch (err) {
    $("#drawer").innerHTML = `<div class="top"><h1 id="drawer-title">Model call</h1><button class="close" id="drawer-close">Close</button></div><p>Could not load it: ${esc(err.message)}</p>`;
    $("#drawer-close").addEventListener("click", closeDrawer);
    return;
  }
  if (state.call !== id) return;
  const dr = $("#drawer");
  const old = $(".thinking", dr);
  const pinned = !old || old.scrollTop + old.clientHeight >= old.scrollHeight - 12;  // follow the stream only if already at the bottom
  const top = dr.scrollTop;
  renderCall(c);
  dr.scrollTop = first ? 0 : top;
  const box = $(".thinking", dr);
  if (box && c.status === "running" && pinned) box.scrollTop = box.scrollHeight;
  if (first) $("#drawer-close").focus();
  if (c.status === "running") callTimer = setTimeout(() => refreshCall(), 1000);
}

function argsCell(args) {
  if (args == null) return "";
  if (typeof args === "string") return `<pre class="args mono">${esc(args)}</pre>`;
  const long = Object.values(args).some(v => typeof v === "object" || (typeof v === "string" && v.length > 60));
  if (long) return `<pre class="args mono">${esc(JSON.stringify(args, null, 2))}</pre>`;
  return Object.entries(args).map(([k, v]) => `${esc(k)} ${k === "color" && typeof v === "string"
    ? `<span style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${esc(v)};vertical-align:middle"></span> ` : ""}${esc(v)}`).join(", ");
}

function outcomeCell(r, running) {
  if (!r) return `<span class="quiet">${running ? "streaming" : "not recorded"}</span>`;
  if (r.status === "applied") return `applied${r.delta_error != null ? `, error ${signed(r.delta_error, 4)}` : ""}${r.note ? `, ${esc(r.note)}` : ""}`;
  if (r.status === "rejected") return `<span class="down">rejected, ${esc(r.error)}</span>`;
  return `<span class="quiet">${esc(r.status)}${r.error ? `, ${esc(r.error)}` : ""}</span>`;
}

function messageHtml(m) {
  const parts = typeof m.content === "string" ? [{ type: "text", text: m.content }] : (m.content || []);
  const role = m.role === "tool" ? `result of ${m.name || "a tool"}${m.is_error ? ", an error" : ""}` : m.role;
  return `<div class="msg"><div class="role">${esc(role)}</div>${parts.map(p =>
    p.type === "text" ? `<div class="txt">${esc(p.text)}</div>`
    : p.artifact ? `<img src="${art(p.artifact)}" alt="Image sent to the model">`
    : `<div class="quiet">${esc(p.type)}</div>`).join("")}</div>`;
}

function renderCall(c) {
  const dr = $("#drawer");
  dr.style.setProperty("--pig", pig(c.node));
  const u = c.usage || {};
  const running = c.status === "running";
  const end = c.ended || Date.now() / 1000;
  const kv = [
    [running ? "running" : c.status === "error" ? "failed" : "done", "status"],
    [u.prompt_tokens ?? "n/a", "tokens in"],
    [cachedOf(u) != null ? `${cachedOf(u)}${u.prompt_tokens ? ` (${Math.round(100 * cachedOf(u) / u.prompt_tokens)}%)` : ""}` : "n/a", "from cache"],
    [u.completion_tokens ?? "n/a", "tokens out"],
    [(u.completion_tokens_details || {}).reasoning_tokens ?? "n/a", "thinking tokens"],
    [usd(u.cost), "cost"],
    [c.first_token ? `${fmt(c.first_token - c.started, 1)}s` : "n/a", "first token"],
    [`${fmt(end - c.started, 1)}s`, running ? "so far" : "total time"],
    [c.finish_reason || "n/a", "finish reason"],
  ];
  const req = c.request || {};
  const toolCalls = c.tool_calls || [];
  const results = c.tool_results || [];
  let html = `<div class="top"><span class="swatch"></span><h1 id="drawer-title">Model call</h1><button class="close" id="drawer-close">Close</button></div>
    <div class="quiet">${esc(c.node || "No node")}, ${esc(c.mutator || c.purpose)}, ${esc(c.model)}. Started ${clock(c.started)}.${c.organism_id ? ` Working on <button class="linkish" data-org="${esc(c.organism_id)}">${short(c.organism_id)}</button>.` : ""}</div>`;
  if (state.callFrom && state.callFrom !== c.organism_id) html += `<div><button class="btn" data-org="${esc(state.callFrom)}">Back to ${short(state.callFrom)}</button></div>`;
  const convo = c.conversation_calls || [];
  if (convo.length) {
    const at = convo.findIndex(x => x.id === c.id);
    const prev = convo[at - 1], next = convo[at + 1];
    html += `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <span>Turn ${at + 1} of ${convo.length} in one conversation.</span>
      ${prev ? `<button class="btn" data-goto="${esc(prev.id)}">Previous turn</button>` : ""}
      ${next ? `<button class="btn" data-goto="${esc(next.id)}">Next turn</button>` : ""}
      <span class="quiet">"What the model was sent" shows only what this turn added. The model also had every earlier turn.</span></div>`;
  }
  html += `<div class="kv">${kv.map(([v, k]) => `<div><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("")}</div>`;
  if (c.error) html += `<div class="change" style="border-left:3px solid var(--alarm)">${esc(c.error)}</div>`;
  if (c.finish_reason === "length") {
    const thought = (u.completion_tokens_details || {}).reasoning_tokens;
    html += `<div class="change" style="border-left:3px solid var(--warn)">The reply hit its ${esc(req.max_tokens ?? "")} token limit${thought ? `, ${Number(thought).toLocaleString()} of them spent thinking` : ""}.${toolCalls.length ? "" : " It made no tool calls."}</div>`;
  }

  html += `<section><h3>Thinking${c.reasoning ? ` <span class="quiet" style="font-weight:400">${c.reasoning.length.toLocaleString()} characters</span>` : ""}</h3>${
    c.reasoning ? `<div class="thinking">${esc(c.reasoning)}</div>`
    : `<p class="quiet" style="margin:0">${running ? "Nothing yet. Thinking shows up here as it streams."
      : u.reasoning_hidden ? "The provider sent its thinking encrypted, so there's nothing readable to show."
      : "No thinking came back. With --reasoning none the model skips it, and some providers don't return it."}</p>`}</section>`;
  if (c.content) html += `<section><h3>Reply</h3><div class="change" style="white-space:pre-wrap">${esc(c.content)}</div></section>`;
  if (toolCalls.length) {
    html += `<section><h3>Tool calls <span class="quiet" style="font-weight:400">${toolCalls.length}</span></h3>
      <div style="overflow-x:auto"><table class="evals"><thead><tr><th>#</th><th>Tool</th><th>Arguments</th><th>What happened</th></tr></thead><tbody>
      ${toolCalls.map((t, i) => `<tr><td>${i + 1}</td><td>${esc(t.name)}</td><td>${argsCell(t.arguments)}</td><td>${outcomeCell(results[i], running)}</td></tr>`).join("")}
      </tbody></table></div></section>`;
  }

  html += `<section><h3>What the model was sent</h3><div style="display:grid;gap:8px">${(req.messages || []).map(messageHtml).join("")}</div>`;
  const tools = req.tools || [];
  if (tools.length) {
    const choice = req.tool_choice == null ? "" : typeof req.tool_choice === "string" ? req.tool_choice : `forced ${(req.tool_choice.function || {}).name || ""}`;
    html += `<details style="margin-top:8px"><summary>${tools.length} tools offered${choice ? `, tool choice ${esc(choice)}` : ""}</summary>
      <ul style="margin:6px 0 0;padding-left:18px">${tools.map(t => `<li><b>${esc(t.function.name)}</b>: ${esc(t.function.description || "")}</li>`).join("")}</ul></details>`;
  }
  html += `<p class="quiet" style="margin:8px 0 0">Temperature ${esc(req.temperature ?? "default")}, max tokens ${esc(req.max_tokens ?? "default")}${req.reasoning ? `, reasoning effort ${esc(req.reasoning.effort ?? JSON.stringify(req.reasoning))}` : ""}.</p></section>`;

  dr.innerHTML = html;
  $("#drawer-close").addEventListener("click", closeDrawer);
  dr.querySelectorAll("[data-org]").forEach(b => b.addEventListener("click", () => openDrawer(b.dataset.org)));
  dr.querySelectorAll("[data-goto]").forEach(b => b.addEventListener("click", () => openCall(b.dataset.goto, state.callFrom)));
}

/* ---------- boot ---------- */

(async function boot() {
  // Read before writeUrl() rewrites the query string. tick() drops the node if the run doesn't have it.
  const { org, node, call } = readUrl();
  state.node = node;
  try {
    if (!(await loadRuns())) { setInterval(async () => { if (await loadRuns()) location.reload(); }, 3000); return; }
  } catch (err) {
    $("#runstate-text").textContent = "Server unreachable";
    return;
  }
  writeUrl();
  await tick(true);
  if (call) openCall(call); else if (org) openDrawer(org);
  setInterval(() => { if (!document.hidden) tick(); }, 2000);
  setInterval(loadLive, 1000);
  setInterval(async () => { try { await loadRuns(); } catch {} }, 15000);
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { state.lastSeq = null; tick(true); }, 200); });
})();
</script>
</body>
</html>
